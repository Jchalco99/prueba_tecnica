# fly.toml app configuration file generated for backend-frosty-haze-832 on 2026-11-12T02:18:02-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'backend-frosty-haze-832'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
